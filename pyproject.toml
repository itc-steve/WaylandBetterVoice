[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "waylandbettervoice"
version = "1.4.1"
description = "Local GPU dictation + meeting transcription for Wayland/niri"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# runtime deps provided by Arch packages (python-numpy, python-pywhispercpp, …)
dependencies = []

[project.urls]
Homepage = "https://github.com/itc-steve/WaylandBetterVoice"

[project.scripts]
wbv = "waylandbettervoice.__main__:main"

[tool.setuptools.packages.find]
include = ["waylandbettervoice*"]
